# Render.com Infrastructure Blueprint
# Allows 1-Click deployment on Render with managed PostgreSQL
services:
  - type: web
    name: robinhood-launchpad
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ROBINHOOD_RPC_URL
        value: https://rpc.testnet.chain.robinhood.com
      - key: DATABASE_URL
        fromDatabase:
          name: robinhood-db
          property: connectionString

databases:
  - name: robinhood-db
    plan: free
    region: oregon
    databaseName: robinhood_launchpad
    user: launchpad
