[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"
# Optional Alchemy backup:
# robinhood_alchemy = "https://robinhood-testnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"

[etherscan]
robinhood_testnet = { key = "any_key_accepted", url = "https://explorer.testnet.chain.robinhood.com/api" }
